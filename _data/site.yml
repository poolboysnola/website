# ==========================================================================
# Pool Boys NOLA — shared site details
# --------------------------------------------------------------------------
# This is the one place to change the brand details, the navigation, and the
# footer link columns. _includes/header.html and _includes/footer.html read
# from here, and Jekyll rebuilds every page on push.
#
# It replaces the SITE object that used to live at the top of assets/site.js.
#
# `id` on a link matches the `page_id` in a page's front matter, which is how
# the current page gets aria-current="page" in the nav.
# ==========================================================================


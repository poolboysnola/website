<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pool Boys NOLA — brand mark, standalone / editable copy.

  Same artwork as BRAND_MARK in assets/site.js, with the CSS custom
  properties resolved to literal hex so it opens correctly in Inkscape. Those
  properties only exist inside the site's stylesheet, so a standalone SVG
  referring to them renders every shape black.

  Light-theme palette, which is the brand palette:
    teal  #1B8A8F   gold  #FFC64B   coral #FF6B54   white #FFFFFF
  The site's dark theme swaps these for #3AA7AB / #FFD268 / #FF8871.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="48" height="48" viewBox="0 0 48 48"
     fill="none" version="1.1">

  <title>Pool Boys NOLA brand mark</title>

  <g id="brand-mark">
    <circle id="disc" cx="24" cy="24" r="23" fill="#1B8A8F"/>
    <path id="wave-gold"
          d="M12 30c2.5 2 4.5 2 7 0s4.5-2 7 0 4.5 2 7 0 4.5-2 7 0"
          fill="none" stroke="#FFC64B" stroke-width="2.4" stroke-linecap="round"/>
    <path id="wave-white"
          d="M12 22c2.5 2 4.5 2 7 0s4.5-2 7 0 4.5 2 7 0 4.5-2 7 0"
          fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"
          opacity="0.85"/>
    <circle id="sun" cx="24" cy="13" r="3.4" fill="#FF6B54"/>
  </g>
</svg>
